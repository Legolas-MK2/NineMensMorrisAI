<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#0f1729">
    <meta name="color-scheme" content="dark">
    <title>Nine Men's Morris</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.ico">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}?v=4">
</head>
<body>
    <main class="layout">
        <section class="panel panel-board" aria-label="Board">
            <div class="board-header">
                <button type="button" class="player-card" id="player-card-0">
                    <span class="player-dot dot-white"></span>
                    <span class="player-label" id="p0-label">White</span>
                    <span class="player-pieces" id="p0-pieces">0</span>
                    <span class="player-reserve" id="p0-reserve">9 left</span>
                </button>

                <button type="button" class="phase-badge is-swap" id="phase-display">↔ Swap</button>

                <button type="button" class="player-card" id="player-card-1">
                    <span class="player-dot dot-black"></span>
                    <span class="player-label" id="p1-label">Black</span>
                    <span class="player-pieces" id="p1-pieces">0</span>
                    <span class="player-reserve" id="p1-reserve">9 left</span>
                </button>
            </div>

            <div id="capture-banner" class="capture-banner hidden">
                <span class="capture-icon" aria-hidden="true">🎯</span>
                <span id="capture-banner-text">Mill formed — capture an opponent piece!</span>
            </div>

            <div class="board-wrap">
                <svg id="board" viewBox="0 0 700 700" preserveAspectRatio="xMidYMid meet" role="img" aria-label="Nine Men's Morris board">
                    <g id="board-lines"></g>
                    <g id="board-points"></g>
                    <g id="board-pieces"></g>
                    <g id="board-highlights"></g>
                </svg>
            </div>

            <div class="status-bar">
                <span id="turn-indicator">Press Reset to start</span>
            </div>

            <div class="button-row">
                <button id="reset-btn" class="btn btn-primary">Reset game</button>
            </div>
        </section>
    </main>

    <script src="{{ url_for('static', filename='app.js') }}?v=8"></script>
</body>
</html>
