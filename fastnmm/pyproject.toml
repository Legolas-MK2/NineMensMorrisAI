[build-system]
requires = ["setuptools>=61", "wheel", "pybind11>=2.10"]
build-backend = "setuptools.build_meta"

[project]
name = "fastnmm"
version = "0.1.0"
description = "Extremely fast Nine Men's Morris engine with OpenSpiel-compatible interface."
readme = "README.md"
requires-python = ">=3.8"
authors = [{ name = "fastnmm contributors" }]
license = { text = "Apache-2.0" }
classifiers = [
    "Programming Language :: C++",
    "Programming Language :: Python :: 3",
    "Topic :: Games/Entertainment :: Board Games",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = []

[project.optional-dependencies]
test = ["pytest>=7", "numpy>=1.20"]
openspiel = ["open_spiel>=1.5"]

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]
